name: bootstrap exact v6 archive

on:
  push:
    paths:
      - '.github/workflows/bootstrap-from-drive.yml'

permissions:
  contents: write

jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          url='https://sdmntprnortheu.oaiusercontent.com/files/00000000-80e0-81f4-bb53-3ed719e65ec5/raw?se=2026-09-21T09%3A48%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=391c47b3-d407-5065-9dc9-318890b47f30&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T08%3A19%3A13Z&ske=2026-09-22T08%3A19%3A13Z&sks=b&skv=2026-02-06&sig=SexoODuylcSS10OSqQtDGR5fviSonKQTWH8ehfcKC8I%3D'
          curl --fail --location --retry 3 --retry-delay 2 "$url" -o /tmp/windaudit.zip
          echo '3c409549c0367a8c920c7ec4f7deedfd0d5177c1cfba96271e37ac32bd59eafe  /tmp/windaudit.zip' | sha256sum -c -

      - name: Replace non-workflow tree from exact archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/windaudit-unpack
          mkdir -p /tmp/windaudit-unpack
          unzip -q /tmp/windaudit.zip -d /tmp/windaudit-unpack
          test -f /tmp/windaudit-unpack/windaudit/README.md
          test -f /tmp/windaudit-unpack/windaudit/.github/workflows/tests.yml
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a --exclude='.github/' /tmp/windaudit-unpack/windaudit/ ./
          mkdir -p .github/workflows
          cp /tmp/windaudit-unpack/windaudit/.github/workflows/tests.yml .github/workflows/tests.yml

      - name: Verify repository manifests
        run: python scripts/verify_repo.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and run tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Commit verified non-workflow tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sergei Evland'
          git config user.email 'sergei.evland@gmail.com'
          git add -A -- . ':(exclude).github/**'
          git diff --cached --quiet && exit 0
          git commit -m 'Import exact verified windaudit v6 release'
          git push origin HEAD:main
